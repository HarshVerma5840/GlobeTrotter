[project]
name = "globetrotter-backend"
version = "0.1.0"
description = "GlobeTrotter API — FastAPI + SQLAlchemy + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 reads bcrypt.__about__, removed in bcrypt 4.1+.
    # Transitive impl detail; CONTRACTS §0 pins passlib[bcrypt] only.
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "groq>=0.11",
    "googlemaps>=4.10",
    # Runtime dep of services/feasibility.py (Google Directions call, B11) —
    # not just a test client, so it belongs in main deps.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Three services, matching CONTRACTS.md §0/§1 exactly — db, api, web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globetrotter}
      POSTGRES_USER: ${POSTGRES_USER:-globetrotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globetrotter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - globetrotter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globetrotter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-globetrotter}:${POSTGRES_PASSWORD:-globetrotter}@db:5432/${POSTGRES_DB:-globetrotter}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic

  web:
    build: ./frontend
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  globetrotter-db-data:

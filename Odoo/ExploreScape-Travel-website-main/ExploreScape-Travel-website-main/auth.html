<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotter - Authentication</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-left">
      <div class="overlay"></div>
      <div class="brand">
        <a href="index.html" class="logo">GlobeTrotter</a>
        <p>The art of travel refined for the intellectually curious.</p>
      </div>
    </div>
    
    <div class="auth-right">
      <div class="form-wrapper">
        <!-- Sign In Form -->
        <div id="signInForm" class="auth-form active-form">
          <h2>Welcome Back</h2>
          <p class="subtitle">Enter your credentials to access your account.</p>
          
          <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="input-group">
              <label for="username"><i class="fa-solid fa-user"></i> Username</label>
              <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="input-group">
              <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
              <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="submit-btn">SIGN IN <i class="fa-solid fa-arrow-right"></i></button>
          </form>
          
          <p class="toggle-text">
            Don't have an account? <span class="toggle-link" onclick="toggleForm('signUpForm')">Sign up</span>
          </p>
        </div>

        <!-- Sign Up Form -->
        <div id="signUpForm" class="auth-form">
          <h2>Create Account</h2>
          <p class="subtitle">Join GlobeTrotter and start planning your next journey.</p>
          
          <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-row">
              <div class="input-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="First Name" required>
              </div>
              <div class="input-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Last Name" required>
              </div>
            </div>
            
            <div class="form-row">
              <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Email Address" required>
              </div>
              <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Phone Number">
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="City" required>
              </div>
              <div class="input-group">
                <label for="country">Country</label>
                <input type="text" id="country" placeholder="Country" required>
              </div>
            </div>

            <div class="input-group">
              <label for="additionalInfo">Additional Information</label>
              <textarea id="additionalInfo" rows="3" placeholder="Tell us more about your travel preferences..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">REGISTER <i class="fa-solid fa-arrow-right"></i></button>
          </form>
          
          <p class="toggle-text">
            Already have an account? <span class="toggle-link" onclick="toggleForm('signInForm')">Sign in</span>
          </p>
        </div>

      </div>
    </div>
  </div>

  <script>
    function toggleForm(formId) {
      document.querySelectorAll('.auth-form').forEach(form => {
        form.classList.remove('active-form');
        // small delay for transition
        setTimeout(() => {
          form.style.display = 'none';
        }, 300);
      });
      
      const targetForm = document.getElementById(formId);
      setTimeout(() => {
        targetForm.style.display = 'block';
        setTimeout(() => {
          targetForm.classList.add('active-form');
        }, 50);
      }, 300);
    }
  </script>
</body>
</html>
